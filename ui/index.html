<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xsqld 控制台</title>
<style>
  :root {
    --bg: #0f1419; --panel: #171d24; --line: #263039; --fg: #d7dee6;
    --dim: #8b98a5; --accent: #4ea1ff; --ok: #3fb950; --warn: #d29922; --err: #f85149;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .meta { color: var(--dim); font-size: 12px; font-family: var(--mono); }
  select, input, button, textarea {
    background: #0d1117; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; font-size: 13px; font-family: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }
  nav { display: flex; gap: 4px; padding: 8px 16px 0; background: var(--panel);
        border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  nav button { border: none; background: none; border-radius: 6px 6px 0 0; padding: 7px 14px; color: var(--dim); }
  nav button.on { background: var(--bg); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
  main { padding: 16px; }
  section { display: none; }
  section.on { display: block; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card .k { color: var(--dim); font-size: 12px; }
  .card .v { font-size: 21px; font-family: var(--mono); margin-top: 3px; word-break: break-all; }
  .card .s { color: var(--dim); font-size: 11px; font-family: var(--mono); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; position: sticky; top: 0; background: var(--panel); z-index: 1; }
  td.num, th.num { text-align: right; font-family: var(--mono); }
  tbody tr:hover { background: #1b232c; }
  .wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 62vh; }
  .mono { font-family: var(--mono); }
  .dim { color: var(--dim); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
         border: 1px solid var(--line); color: var(--dim); }
  .tag.on { color: var(--ok); border-color: var(--ok); }
  .tag.off { color: var(--dim); }
  .tag.changed { color: var(--warn); border-color: var(--warn); }
  h2 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .6px; }
  h2:first-child { margin-top: 0; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  textarea { width: 100%; min-height: 150px; font-family: var(--mono); font-size: 13px; resize: vertical; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  pre.err { background: #2a1416; border: 1px solid var(--err); color: #ffb4ae; padding: 10px;
            border-radius: 6px; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; margin: 0 0 10px; }
  .spark { display: block; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .chart .t { font-size: 12px; color: var(--dim); font-family: var(--mono); display: flex; justify-content: space-between; }
  .schema-item { border-bottom: 1px solid var(--line); padding: 7px 9px; }
  .schema-item summary { cursor: pointer; font-family: var(--mono); font-size: 13px; }
  .schema-item pre { margin: 6px 0 0; white-space: pre-wrap; color: var(--dim); font-size: 12px; font-family: var(--mono); }
  .hist { font-family: var(--mono); font-size: 12px; color: var(--dim); cursor: pointer;
          padding: 3px 0; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist:hover { color: var(--accent); }
  .null { color: #6e7681; font-style: italic; }
  .blob { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>xsqld 控制台</h1>
  <span class="meta" id="ver"></span>
  <span class="meta" id="up"></span>
  <span style="flex:1"></span>
  <label class="dim">命名空间</label>
  <select id="ns"></select>
  <label class="dim"><input type="checkbox" id="auto" checked> 自动刷新</label>
  <button id="refresh">刷新</button>
</header>
<nav>
  <button data-tab="overview" class="on">概览</button>
  <button data-tab="params">参数</button>
  <button data-tab="schema">结构</button>
  <button data-tab="sql">SQL 工作台</button>
  <button data-tab="trends">指标趋势</button>
</nav>
<main>
  <section id="overview" class="on">
    <div class="cards" id="cards"></div>
    <h2>命名空间与文件</h2>
    <div class="wrap"><table id="nstab"><thead><tr>
      <th>命名空间</th><th>状态</th><th class="num">data</th><th class="num">WAL</th>
      <th class="num">SHM</th><th class="num">DuckDB 镜像</th><th class="num">镜像 WAL</th>
    </tr></thead><tbody></tbody></table></div>
    <h2>全局指标</h2>
    <div class="wrap"><table id="globaltab"><thead><tr><th>指标</th><th class="num">值</th></tr></thead><tbody></tbody></table></div>
    <h2>当前命名空间指标</h2>
    <div class="wrap"><table id="nsmetrics"><thead><tr><th>指标</th><th class="num">值</th></tr></thead><tbody></tbody></table></div>
  </section>

  <section id="params">
    <div class="row">
      <label class="dim"><input type="checkbox" id="onlychanged"> 只看与默认值不同的</label>
      <input id="pfilter" placeholder="过滤参数名…" style="min-width:220px">
      <span class="status" id="pcount"></span>
    </div>
    <div class="wrap"><table id="ptab"><thead><tr>
      <th>参数</th><th>当前值</th><th>默认值</th><th>状态</th>
    </tr></thead><tbody></tbody></table></div>
  </section>

  <section id="schema">
    <div class="row">
      <button id="loadcounts">统计各表行数</button>
      <span class="status" id="sstatus"></span>
    </div>
    <h2>PRAGMA</h2>
    <div class="wrap" style="max-height:30vh"><table id="pragmatab"><thead><tr><th>参数</th><th>值</th></tr></thead><tbody></tbody></table></div>
    <h2>表</h2>
    <div class="wrap" style="max-height:32vh"><table id="tabletab"><thead><tr>
      <th>表</th><th>类型</th><th class="num">行数</th><th>镜像视图</th>
    </tr></thead><tbody></tbody></table></div>
    <h2>建表语句 / 索引 / 触发器</h2>
    <div class="wrap" id="ddl" style="max-height:40vh"></div>
  </section>

  <section id="sql">
    <div class="row">
      <label class="dim">引擎</label>
      <select id="engine">
        <option value="sqlite">SQLite（行存，真相源）</option>
        <option value="duckdb">DuckDB（列存镜像 *_native）</option>
      </select>
      <button class="primary" id="run">执行 (Ctrl+Enter)</button>
      <button id="clear">清空</button>
      <span class="status" id="qstatus"></span>
    </div>
    <textarea id="q" spellcheck="false" placeholder="SELECT status, COUNT(*) AS n FROM orders GROUP BY status;"></textarea>
    <div id="qerr"></div>
    <div class="row" style="margin-top:10px">
      <span class="status" id="qmeta"></span>
    </div>
    <div class="wrap"><table id="rtab"><thead></thead><tbody></tbody></table></div>
    <h2>历史</h2>
    <div id="hist"></div>
  </section>

  <section id="trends">
    <div class="row">
      <label class="dim">序列</label>
      <select id="series" style="min-width:340px"></select>
      <span class="status" id="tstatus"></span>
    </div>
    <div class="grid2" id="charts"></div>
  </section>
</main>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || sessionStorage.getItem("xsqld_token") || "";
if (TOKEN) sessionStorage.setItem("xsqld_token", TOKEN);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n).toLocaleString("en-US");
const bytes = (n) => {
  if (n === undefined || n === null) return "—";
  const u = ["B", "KiB", "MiB", "GiB", "TiB"]; let i = 0, v = Number(n);
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + " " + u[i];
};

async function api(path, options) {
  const opts = Object.assign({}, options);
  opts.headers = Object.assign({ "x-xsqld-ui-token": TOKEN }, opts.headers || {});
  const r = await fetch(path, opts);
  const text = await r.text();
  let json;
  try { json = JSON.parse(text); } catch { json = { error: text.slice(0, 400) }; }
  if (!r.ok) throw new Error(json.error || ("HTTP " + r.status));
  return json;
}

let OVERVIEW = null, STATE = null, COUNTS = {}, TRENDS = [];
let currentNs = localStorage.getItem("xsqld_ns") || "";

function tab(name) {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  document.querySelectorAll("main section").forEach((s) => s.classList.toggle("on", s.id === name));
  localStorage.setItem("xsqld_tab", name);
  if (name === "trends") drawTrends();
}
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => tab(b.dataset.tab));

function metricRows(tableId, entries) {
  const tb = $(tableId).tBodies[0];
  tb.textContent = "";
  for (const [k, v] of entries) {
    const tr = tb.insertRow();
    tr.insertCell().textContent = k;
    const c = tr.insertCell(); c.className = "num";
    c.textContent = Number.isInteger(v) ? fmt(v) : String(v);
  }
  if (!entries.length) {
    const tr = tb.insertRow(); const c = tr.insertCell(); c.colSpan = 2; c.className = "dim"; c.textContent = "（无）";
  }
}

// `name|ns="shop",reason="x"` -> `name{reason="x"}`: the namespace is already the section's subject, but the
// other labels tell apart series that share a name (parallel_fallback_total has one per reason)
function seriesLabel(key) {
  const [name, labels] = key.split("|");
  const bare = name.replace(/^xsqld_/, "");
  if (!labels) return bare;
  const rest = labels.split(",").filter((l) => !/^ns=/.test(l));
  return rest.length ? bare + "{" + rest.join(",") + "}" : bare;
}

function renderOverview() {
  const o = OVERVIEW;
  $("ver").textContent = "v" + o.version + " (" + o.commit + ") · SQLite " + o.sqlite;
  const h = Math.floor(o.uptime_seconds / 3600), m = Math.floor((o.uptime_seconds % 3600) / 60);
  $("up").textContent = "运行 " + h + "h" + m + "m";

  const sel = $("ns");
  const names = o.namespaces.map((n) => n.name);
  if (!names.includes(currentNs)) currentNs = names[0] || "";
  sel.textContent = "";
  for (const n of names) {
    const opt = document.createElement("option");
    opt.value = n; opt.textContent = n;
    sel.appendChild(opt);
  }
  sel.value = currentNs;

  const g = Object.entries(o.metrics).filter(([k]) => !k.includes("|"));
  const nsMetrics = Object.entries(o.metrics).filter(([k]) => k.includes('ns="' + currentNs + '"'));
  const pick = (name) => { const e = g.find(([k]) => k === "xsqld_" + name); return e ? e[1] : 0; };
  const nsm = (name) => { const e = nsMetrics.find(([k]) => k.split("|")[0] === "xsqld_" + name); return e ? e[1] : null; };

  const cards = [
    ["命名空间", o.namespaces.length, o.namespaces.filter((n) => n.open).length + " 个已打开"],
    ["工作线程", pick("worker_threads"), "上限 " + pick("worker_threads_max")],
    ["活跃流", pick("streams"), "固定事务 " + pick("streams_pinned")],
    ["读请求", nsm("read_requests_total"), "当前库累计"],
    ["写请求", nsm("write_requests_total"), "当前库累计"],
    ["写队列", nsm("write_queue_length"), "等待写线程"],
    ["WAL 帧", nsm("wal_frames"), "检查点阈值见参数"],
    ["HTAP 水位", nsm("htap_watermark"), nsm("htap_enabled") ? "镜像已启用" : "镜像未启用"],
    ["HTAP 滞后", nsm("htap_lag"), "源位置 " + (nsm("htap_source_position") ?? "—")],
    ["HTAP 重建", nsm("htap_rebuilds_total"), "同步错误 " + (nsm("htap_sync_errors_total") ?? "—")],
  ];
  $("cards").textContent = "";
  for (const [k, v, s] of cards) {
    const d = document.createElement("div"); d.className = "card";
    d.innerHTML = '<div class="k">' + esc(k) + '</div><div class="v">' +
      (v === null || v === undefined ? "—" : esc(fmt(v))) + '</div><div class="s">' + esc(s ?? "") + "</div>";
    $("cards").appendChild(d);
  }

  const tb = $("nstab").tBodies[0]; tb.textContent = "";
  for (const n of o.namespaces) {
    const f = Object.fromEntries(n.files);
    const tr = tb.insertRow();
    const c0 = tr.insertCell(); c0.textContent = n.name; c0.className = "mono";
    const c1 = tr.insertCell();
    c1.innerHTML = '<span class="tag ' + (n.open ? "on" : "off") + '">' + (n.open ? "已打开" : "未打开") + "</span>";
    for (const key of ["data", "wal", "shm", "duckdb", "duckdb.wal"]) {
      const c = tr.insertCell(); c.className = "num"; c.textContent = bytes(f[key]);
    }
  }
  metricRows("globaltab", g.map(([k, v]) => [seriesLabel(k), v]));
  metricRows("nsmetrics", nsMetrics.map(([k, v]) => [seriesLabel(k), v]));
  renderParams();
}

function renderParams() {
  if (!OVERVIEW) return;
  const only = $("onlychanged").checked;
  const filter = $("pfilter").value.trim().toLowerCase();
  const rows = OVERVIEW.params.filter((p) =>
    (!only || p.changed) && (!filter || p.name.toLowerCase().includes(filter)));
  const tb = $("ptab").tBodies[0]; tb.textContent = "";
  const show = (v) => v === null ? "null" : (typeof v === "object" ? JSON.stringify(v) : String(v));
  for (const p of rows) {
    const tr = tb.insertRow();
    const c0 = tr.insertCell(); c0.textContent = "--" + p.name.replace(/_/g, "-"); c0.className = "mono";
    const c1 = tr.insertCell(); c1.textContent = show(p.value); c1.className = "mono";
    const c2 = tr.insertCell(); c2.textContent = show(p.default); c2.className = "mono dim";
    const c3 = tr.insertCell();
    c3.innerHTML = p.changed ? '<span class="tag changed">已修改</span>' : '<span class="tag">默认</span>';
  }
  $("pcount").textContent = rows.length + " / " + OVERVIEW.params.length + " 项";
}
$("onlychanged").onchange = renderParams;
$("pfilter").oninput = renderParams;

function renderSchema() {
  if (!STATE) return;
  const pt = $("pragmatab").tBodies[0]; pt.textContent = "";
  for (const [k, v] of Object.entries(STATE.pragmas)) {
    const tr = pt.insertRow();
    tr.insertCell().textContent = k;
    const c = tr.insertCell(); c.textContent = v; c.className = "mono";
  }
  const kinds = STATE.table_kinds || {};
  const tables = STATE.schema.filter((s) => s.type === "table");
  const tt = $("tabletab").tBodies[0]; tt.textContent = "";
  for (const t of tables) {
    const tr = tt.insertRow();
    const c0 = tr.insertCell(); c0.textContent = t.name; c0.className = "mono";
    tr.insertCell().textContent = kinds[t.name] || "table";
    const c2 = tr.insertCell(); c2.className = "num";
    c2.textContent = COUNTS[t.name] !== undefined ? fmt(COUNTS[t.name]) : "—";
    const c3 = tr.insertCell(); c3.className = "mono dim";
    const internal = t.name.startsWith("xsqld_") || t.name.startsWith("sqlite_");
    c3.textContent = internal ? "（内部对象，不镜像）" : t.name + "_native";
  }
  const ddl = $("ddl"); ddl.textContent = "";
  for (const s of STATE.schema) {
    const d = document.createElement("details"); d.className = "schema-item";
    const sum = document.createElement("summary");
    sum.textContent = "[" + s.type + "] " + s.name + (s.table && s.table !== s.name ? "  on " + s.table : "");
    const pre = document.createElement("pre"); pre.textContent = s.sql;
    d.appendChild(sum); d.appendChild(pre); ddl.appendChild(d);
  }
}

$("loadcounts").onclick = async () => {
  if (!currentNs) return;
  $("sstatus").textContent = "统计中…"; $("sstatus").className = "status";
  try {
    COUNTS = await api("/ui/api/ns/" + encodeURIComponent(currentNs) + "/counts");
    $("sstatus").textContent = "完成"; $("sstatus").className = "status ok";
    renderSchema();
  } catch (e) {
    $("sstatus").textContent = e.message; $("sstatus").className = "status err";
  }
};

function valueCell(td, v) {
  if (!v || v.type === "null") { td.innerHTML = '<span class="null">NULL</span>'; return; }
  if (v.type === "blob") { td.innerHTML = '<span class="blob mono">blob(' + esc(atob(v.base64).length) + " B)</span>"; return; }
  td.textContent = v.value;
  if (v.type === "integer" || v.type === "float") td.className = "num";
}

const HISTORY = JSON.parse(localStorage.getItem("xsqld_hist") || "[]");
function renderHistory() {
  const box = $("hist"); box.textContent = "";
  for (const h of HISTORY.slice(0, 25)) {
    const d = document.createElement("div"); d.className = "hist";
    d.textContent = "[" + h.engine + "] " + h.sql.replace(/\s+/g, " ").slice(0, 160);
    d.onclick = () => { $("q").value = h.sql; $("engine").value = h.engine; };
    box.appendChild(d);
  }
}

async function runSql() {
  const sql = $("q").value.trim();
  if (!sql || !currentNs) return;
  const engine = $("engine").value;
  $("qstatus").textContent = "执行中…"; $("qstatus").className = "status";
  $("qerr").textContent = ""; $("qmeta").textContent = "";
  const t0 = performance.now();
  try {
    const resp = await api("/ui/api/ns/" + encodeURIComponent(currentNs) + "/sql", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ engine, sql, args: [] }),
    });
    const wall = performance.now() - t0;
    let result, watermark = null, err = null;
    if (engine === "duckdb") {
      result = resp.result; watermark = resp.watermark;
    } else {
      const first = (resp.results || [])[0];
      if (!first) throw new Error("空响应");
      if (first.type === "error") err = first.error;
      else result = first.response && first.response.result;
    }
    if (err) {
      $("qerr").innerHTML = '<pre class="err">' + esc(err.message || JSON.stringify(err)) + "</pre>";
      $("qstatus").textContent = "失败"; $("qstatus").className = "status err";
    } else if (result) {
      const head = $("rtab").tHead; head.textContent = "";
      const hr = head.insertRow();
      for (const c of result.cols || []) {
        const th = document.createElement("th");
        th.textContent = (c && c.name) || "?";
        if (c && c.decltype) th.title = c.decltype;
        hr.appendChild(th);
      }
      const tb = $("rtab").tBodies[0]; tb.textContent = "";
      for (const row of result.rows || []) {
        const tr = tb.insertRow();
        for (const v of row) valueCell(tr.insertCell(), v);
      }
      const bits = ["往返 " + wall.toFixed(1) + " ms"];
      if (result.query_duration_ms !== undefined) bits.push("引擎 " + Number(result.query_duration_ms).toFixed(2) + " ms");
      bits.push("返回 " + fmt((result.rows || []).length) + " 行");
      if (result.rows_read) bits.push("读 " + fmt(result.rows_read));
      if (result.affected_row_count) bits.push("影响 " + fmt(result.affected_row_count));
      if (result.rows_written) bits.push("写 " + fmt(result.rows_written));
      if (result.last_insert_rowid) bits.push("last_rowid " + result.last_insert_rowid);
      if (watermark !== null && watermark !== undefined) bits.push("watermark " + watermark);
      $("qmeta").textContent = bits.join(" · ");
      $("qstatus").textContent = "完成"; $("qstatus").className = "status ok";
    }
    HISTORY.unshift({ engine, sql });
    HISTORY.length = Math.min(HISTORY.length, 60);
    localStorage.setItem("xsqld_hist", JSON.stringify(HISTORY));
    renderHistory();
  } catch (e) {
    $("qerr").innerHTML = '<pre class="err">' + esc(e.message) + "</pre>";
    $("qstatus").textContent = "失败"; $("qstatus").className = "status err";
  }
}
$("run").onclick = runSql;
$("clear").onclick = () => { $("q").value = ""; $("qerr").textContent = ""; $("qmeta").textContent = ""; };
$("q").addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); runSql(); }
});

const DEFAULT_SERIES = [
  "xsqld_htap_lag", "xsqld_htap_watermark", "xsqld_htap_source_position",
  "xsqld_write_queue_length", "xsqld_wal_frames", "xsqld_worker_threads",
  "xsqld_read_requests_total", "xsqld_write_requests_total",
];

function seriesKeys() {
  const keys = new Set();
  // build_info is a constant 1 carrying the version as labels, not a trend
  for (const s of TRENDS) for (const k of Object.keys(s.series)) if (!k.startsWith("xsqld_build_info")) keys.add(k);
  return [...keys].sort();
}

function renderSeriesPicker() {
  const sel = $("series");
  const prev = sel.value;
  const keys = seriesKeys();
  sel.textContent = "";
  for (const k of keys) {
    const o = document.createElement("option"); o.value = k; o.textContent = k; sel.appendChild(o);
  }
  if (keys.includes(prev)) sel.value = prev;
  else {
    const want = DEFAULT_SERIES.map((n) => n + '|ns="' + currentNs + '"').find((k) => keys.includes(k));
    if (want) sel.value = want;
  }
}
$("series").onchange = drawTrends;

function sparkline(points, w, h) {
  if (points.length < 2) return '<div class="dim" style="font-size:12px">采样不足</div>';
  const vals = points.map((p) => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { hi = lo + 1; lo = lo - 1; }
  const t0 = points[0][0], t1 = points[points.length - 1][0] || t0 + 1;
  const span = Math.max(1, t1 - t0);
  const d = points.map((p) => {
    const x = ((p[0] - t0) / span) * (w - 2) + 1;
    const y = h - 2 - ((p[1] - lo) / (hi - lo)) * (h - 4);
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  return '<svg class="spark" width="100%" height="' + h + '" viewBox="0 0 ' + w + " " + h +
    '" preserveAspectRatio="none"><polyline points="' + d + '" fill="none" stroke="#4ea1ff" stroke-width="1.5"/></svg>' +
    '<div class="t"><span>min ' + fmt(lo) + '</span><span>max ' + fmt(hi) + "</span></div>";
}

function drawTrends() {
  const box = $("charts"); box.textContent = "";
  const keys = seriesKeys();
  if (!keys.length) { $("tstatus").textContent = "还没有采样"; return; }
  $("tstatus").textContent = TRENDS.length + " 个采样点（每 2 秒，保留最近 20 分钟）";
  const chosen = new Set([$("series").value]);
  for (const n of DEFAULT_SERIES) {
    const k = n + '|ns="' + currentNs + '"';
    if (keys.includes(k)) chosen.add(k);
    if (keys.includes(n)) chosen.add(n);
  }
  for (const k of [...chosen].filter(Boolean)) {
    const pts = TRENDS.filter((s) => s.series[k] !== undefined).map((s) => [s.t, s.series[k]]);
    const last = pts.length ? pts[pts.length - 1][1] : null;
    const d = document.createElement("div"); d.className = "chart";
    d.innerHTML = '<div class="t"><span>' + esc(k) + "</span><span>" +
      (last === null ? "—" : esc(fmt(last))) + "</span></div>" + sparkline(pts, 320, 60);
    box.appendChild(d);
  }
}

async function loadOverview() {
  OVERVIEW = await api("/ui/api/overview");
  renderOverview();
}
async function loadState() {
  if (!currentNs) { STATE = null; return; }
  STATE = await api("/ui/api/ns/" + encodeURIComponent(currentNs) + "/state");
  renderSchema();
}
async function loadTrends() {
  TRENDS = await api("/ui/api/trends");
  renderSeriesPicker();
  if ($("trends").classList.contains("on")) drawTrends();
}

async function refreshAll() {
  try {
    await loadOverview();
    await loadState();
    await loadTrends();
  } catch (e) {
    $("qstatus").textContent = e.message; $("qstatus").className = "status err";
  }
}

$("ns").onchange = () => {
  currentNs = $("ns").value;
  localStorage.setItem("xsqld_ns", currentNs);
  COUNTS = {};
  loadState().catch(() => {});
  loadOverview().catch(() => {});
};
$("refresh").onclick = refreshAll;

if (!TOKEN) {
  document.body.innerHTML = '<div style="padding:40px;font-family:var(--mono)">' +
    "缺少控制台令牌。请打开服务启动时打印的 URL（形如 http://127.0.0.1:8090/ui?t=…）。</div>";
} else {
  renderHistory();
  tab(localStorage.getItem("xsqld_tab") || "overview");
  refreshAll();
  setInterval(() => { if ($("auto").checked) refreshAll(); }, 3000);
}
</script>
