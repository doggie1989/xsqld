[package]
name = "xsqld"
version = "0.2.0"
authors = ["HM"]
edition = "2024"
rust-version = "1.91"
description = "Hrana-over-HTTP gateway backed by SeekDB / OceanBase / MySQL protocol"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "xsqld"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-graceful", "service", "tokio"] }
mysql_async = { version = "0.36", default-features = false, features = ["minimal"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
